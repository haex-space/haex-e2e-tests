name: E2E Tests

on:
  push:
    branches: [main]

  # Validate PRs against main before merge — catches failures that would
  # otherwise only surface post-merge on the main branch.
  pull_request:
    branches: [main]

  # Callable from other repositories (haex-vault, haextension, etc.)
  workflow_call:
    inputs:
      build_type:
        description: 'Build type: build (PR/push), nightly, or release'
        type: string
        required: true
      # Version specification (branch, tag, or commit SHA)
      haex_vault_version:
        description: 'haex-vault version (branch, tag, or commit SHA)'
        type: string
        default: 'main'
      haextension_version:
        description: 'haextension version (branch, tag, or commit SHA)'
        type: string
        default: 'main'
      vault_sdk_version:
        description: 'vault-sdk version (branch, tag, or commit SHA)'
        type: string
        default: 'main'
      sync_server_version:
        description: 'haex-sync-server version (branch, tag, or commit SHA)'
        type: string
        default: 'main'
      # Pre-built artifacts (override version if set)
      haex_vault_artifact:
        description: 'GitHub artifact name containing pre-built haex-vault binary'
        type: string
        default: ''
      haex_vault_artifact_run_id:
        description: 'Run ID to download haex-vault artifact from'
        type: string
        default: ''
      haex_vault_android_artifact:
        description: 'GitHub artifact name containing pre-built Android APK'
        type: string
        default: ''
      sync_server_image:
        description: 'Pre-built sync-server Docker image (e.g., ghcr.io/haex-space/haex-sync-server:latest)'
        type: string
        default: ''
      e2e_tests_ref:
        description: 'haex-e2e-tests branch, tag, or SHA for test files (overrides PR head / main default)'
        type: string
        default: ''
      haex_vault_platform:
        description: 'Which haex-vault binary to test: linux (default, Docker-based), windows, or macos (native runner + Tailscale-bridged backend)'
        type: string
        default: 'linux'
    secrets:
      ARTIFACT_TOKEN:
        description: 'Token with permission to download artifacts from other repos'
        required: false
      TS_AUTHKEY:
        description: 'Tailscale reusable + ephemeral auth key (tagged tag:ci-e2e) — only required for haex_vault_platform windows/macos (bridges the Linux-hosted backend stack to the native runner)'
        required: false
    outputs:
      success:
        description: 'Whether all tests passed'
        value: ${{ jobs.e2e-results.outputs.success }}
      test_result:
        description: 'Desktop test result summary'
        value: ${{ jobs.e2e-results.outputs.test_result }}
      artifact_name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.e2e-results.outputs.artifact_name }}
      run_id:
        description: 'GitHub Actions run ID'
        value: ${{ jobs.e2e-results.outputs.run_id }}

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options:
          - build
          - nightly
          - release
        default: build
      haex_vault_version:
        description: 'haex-vault version (branch, tag, or commit SHA)'
        default: 'main'
      haextension_version:
        description: 'haextension version (branch, tag, or commit SHA)'
        default: 'main'
      vault_sdk_version:
        description: 'vault-sdk version (branch, tag, or commit SHA)'
        default: 'main'
      sync_server_version:
        description: 'haex-sync-server version (branch, tag, or commit SHA)'
        default: 'main'
      e2e_tests_ref:
        description: 'haex-e2e-tests branch or SHA for test files (default: main)'
        default: ''
      haex_vault_artifact:
        description: 'GitHub artifact name containing a pre-built haex-vault binary (e.g. haex-vault-windows-e2e) — leave empty to build from haex_vault_version instead'
        default: ''
      haex_vault_artifact_run_id:
        description: 'haex-vault build.yml run ID to download haex_vault_artifact from (required if haex_vault_artifact is set)'
        default: ''
      haex_vault_platform:
        description: 'Which haex-vault binary to test'
        type: choice
        options:
          - linux
          - windows
          - macos
        default: linux

jobs:
  # Build Docker image and save it for parallel test jobs
  build-env:
    name: Build Test Environment
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      image_artifact: e2e-docker-image-${{ github.run_id }}
      use_prebuilt_vault: ${{ steps.prebuilt.outputs.use_prebuilt_vault }}
      haex_vault_version: ${{ steps.versions.outputs.haex_vault_version }}
      haextension_version: ${{ steps.versions.outputs.haextension_version }}
      vault_sdk_version: ${{ steps.versions.outputs.vault_sdk_version }}
      sync_server_version: ${{ steps.versions.outputs.sync_server_version }}

    steps:
      - name: Checkout E2E tests
        uses: actions/checkout@v4
        with:
          repository: haex-space/haex-e2e-tests
          # Ref resolution priority:
          # 1. e2e_tests_ref input — explicit override, e.g. from haex-vault CI
          #    passing a feature branch to test against unreleased test changes.
          # 2. PR head SHA — on pull_request events directly against this repo.
          #    The github.repository guard is essential: under workflow_call
          #    the github context is the caller's, so head.sha would point at
          #    the caller's commit and not exist in this repo.
          #    head.sha (not head.ref) prevents shell injection via branch names.
          # 3. main — fallback for push and workflow_call without an override.
          ref: ${{ inputs.e2e_tests_ref || ((github.event_name == 'pull_request' && github.repository == 'haex-space/haex-e2e-tests') && github.event.pull_request.head.sha || 'main') }}

      - name: Set versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_TOKEN || github.token }}
          INPUT_HAEX_VAULT: ${{ inputs.haex_vault_version }}
          INPUT_HAEXTENSION: ${{ inputs.haextension_version }}
          INPUT_VAULT_SDK: ${{ inputs.vault_sdk_version }}
          INPUT_SYNC_SERVER: ${{ inputs.sync_server_version }}
          # Same probe as the artifact resolver below — see the comment on
          # the download step for the cross-repo branch-coupling rationale.
          # We resolve haex-vault's source ref to the matching branch HEAD
          # so the migrations cloned from GitHub match the binary downloaded
          # from the artifact. Without this the source comes from main and
          # the binary from the feature branch — schema column names diverge.
          E2E_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Resolve each upstream ref to a concrete commit SHA before any
          # consumer (workflow clone, docker-compose build-arg) uses it.
          # BuildKit and `git clone --branch` both treat the value opaquely,
          # so a moving ref like "main" can be served stale, and a 40-char
          # SHA would fail --branch entirely. Resolving up front avoids both
          # failure modes and makes every build auditable (the SHA is logged
          # and flows through as the effective pin).
          resolve_sha() {
            local repo="$1" ref="${2:-main}"
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$ref"
            else
              gh api "repos/${repo}/commits/${ref}" --jq .sha
            fi
          }

          # For haex-vault, when no explicit version was passed (standalone
          # PR/push), resolve a default ref using a tiered fallback so the
          # source clone (which carries database/migrations/) stays in sync
          # with the artifact resolver below, which already picks the
          # matching branch's binary.
          #
          # Priority:
          #   1. Same-named branch (e.g. a feature branch present in both repos)
          #   2. develop  (active integration target since haex-vault adopted
          #      gitflow — main lags behind by a release cycle)
          #   3. main     (final fallback if develop ever goes away)
          HAEX_VAULT_REF="$INPUT_HAEX_VAULT"
          if [ -z "$HAEX_VAULT_REF" ] && [ -n "$E2E_BRANCH" ] && [ "$E2E_BRANCH" != "main" ]; then
            if gh api -X GET "repos/haex-space/haex-vault/branches/$E2E_BRANCH" --silent 2>/dev/null; then
              HAEX_VAULT_REF="$E2E_BRANCH"
              echo "Resolving haex-vault source to matching branch: $HAEX_VAULT_REF"
            fi
          fi
          if [ -z "$HAEX_VAULT_REF" ]; then
            if gh api -X GET "repos/haex-space/haex-vault/branches/develop" --silent 2>/dev/null; then
              HAEX_VAULT_REF="develop"
              echo "Resolving haex-vault source to develop (gitflow integration branch)"
            fi
          fi

          HAEX_VAULT_SHA=$(resolve_sha "haex-space/haex-vault" "$HAEX_VAULT_REF")
          HAEXTENSION_SHA=$(resolve_sha "haex-space/haextension" "$INPUT_HAEXTENSION")
          VAULT_SDK_SHA=$(resolve_sha "haex-space/vault-sdk" "$INPUT_VAULT_SDK")
          SYNC_SERVER_SHA=$(resolve_sha "haex-space/haex-sync-server" "$INPUT_SYNC_SERVER")

          echo "haex_vault_version=$HAEX_VAULT_SHA" >> "$GITHUB_OUTPUT"
          echo "haextension_version=$HAEXTENSION_SHA" >> "$GITHUB_OUTPUT"
          echo "vault_sdk_version=$VAULT_SDK_SHA" >> "$GITHUB_OUTPUT"
          echo "sync_server_version=$SYNC_SERVER_SHA" >> "$GITHUB_OUTPUT"

          echo "Resolved SHAs:"
          echo "  haex-vault:       $HAEX_VAULT_SHA"
          echo "  haextension:      $HAEXTENSION_SHA"
          echo "  vault-sdk:        $VAULT_SDK_SHA"
          echo "  haex-sync-server: $SYNC_SERVER_SHA"

      - name: Clone dependency repositories
        env:
          SYNC_SERVER_SHA: ${{ steps.versions.outputs.sync_server_version }}
        run: |
          mkdir -p repos

          # Clone haex-sync-server at the resolved SHA. `git clone --branch`
          # cannot accept a commit SHA, so we use init + shallow fetch of
          # the specific SHA + checkout FETCH_HEAD. GitHub allows fetching
          # arbitrary SHAs by default (uploadpack.allowReachableSHA1InWant).
          echo "Cloning haex-sync-server at $SYNC_SERVER_SHA..."
          mkdir -p repos/haex-sync-server
          (
            cd repos/haex-sync-server
            git init -q
            git remote add origin https://github.com/haex-space/haex-sync-server.git
            git fetch --depth 1 origin "$SYNC_SERVER_SHA"
            git checkout -q FETCH_HEAD
          )

          # Clone haex-marketplace (always main — no input hook exists yet).
          echo "Cloning haex-marketplace (main)..."
          git clone --depth 1 https://github.com/haex-space/haex-marketplace.git repos/haex-marketplace

      - name: Download haex-vault artifact (if provided via workflow_call)
        if: inputs.haex_vault_artifact != '' && inputs.haex_vault_artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.haex_vault_artifact }}
          run-id: ${{ inputs.haex_vault_artifact_run_id }}
          repository: haex-space/haex-vault
          github-token: ${{ secrets.ARTIFACT_TOKEN || github.token }}
          path: ./docker/prebuilt/haex-vault

      - name: Download latest haex-vault binary (for standalone runs)
        if: inputs.haex_vault_artifact == '' || inputs.haex_vault_artifact_run_id == ''
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_TOKEN || github.token }}
          # Cross-repo branch coupling: when an e2e-tests branch ships test
          # changes that depend on an unmerged haex-vault PR (e.g. schema
          # changes), the matching haex-vault branch usually carries the
          # same name. Without this resolution the e2e shard runs against
          # the latest main artifact and fails on the column/API mismatch.
          # We probe haex-vault for a same-named branch and fall back to
          # main if it doesn't exist. Mirrors haex-vault's symmetric resolver.
          E2E_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Fetching latest successful haex-vault build artifact..."

          # Tiered branch resolution — must stay in sync with the source
          # clone resolver above (Set versions step), otherwise the binary
          # downloaded here and the migrations cloned there can diverge.
          # Priority: same-named → develop → main.
          TARGET_BRANCH="main"
          if [ -n "$E2E_BRANCH" ] && [ "$E2E_BRANCH" != "main" ]; then
            if gh api -X GET "repos/haex-space/haex-vault/branches/$E2E_BRANCH" --silent 2>/dev/null; then
              TARGET_BRANCH="$E2E_BRANCH"
              echo "Found matching haex-vault branch: $TARGET_BRANCH"
            elif gh api -X GET "repos/haex-space/haex-vault/branches/develop" --silent 2>/dev/null; then
              TARGET_BRANCH="develop"
              echo "No matching branch for '$E2E_BRANCH' — using develop (gitflow integration branch)"
            else
              echo "No matching haex-vault branch for '$E2E_BRANCH' — using main"
            fi
          fi

          # Try to download the Linux e2e artifact from the most recent runs on
          # the target branch. We don't filter by conclusion because the haex-vault
          # build often fails its own e2e-tests step while the Linux binary build
          # succeeds (Windows / e2e-tests are slower / flaky). If the artifact
          # isn't uploaded (e.g. ubuntu build itself failed), gh run download
          # returns non-zero and we try the next run. Fall back to main if no
          # usable artifact is found on the feature branch.
          download_artifact() {
            local branch="$1"
            local run_ids
            # The API's own `head_branch` query filter does not reliably match
            # branch names containing "+" (worktree branches conventionally
            # do, e.g. worktree-fix+foo) — true regardless of encoding, this
            # is a server-side matching gap, not a client escaping issue.
            # A silently-empty filter previously made the endpoint fall back
            # to its default (most recent runs across ALL branches),
            # downloading an unrelated PR's binary instead of failing loudly.
            # Fetch unfiltered and match head_branch client-side instead.
            run_ids=$(gh api --method GET "repos/haex-space/haex-vault/actions/workflows/build.yml/runs" \
              -f "per_page=100" \
              --jq ".workflow_runs | map(select(.head_branch == \"${branch}\")) | .[].id" \
              2>/dev/null || echo "")

            for rid in $run_ids; do
              echo "Trying run $rid on '$branch'..."
              if gh run download "$rid" --repo haex-space/haex-vault --name haex-vault-linux-e2e 2>/dev/null; then
                echo "Successfully downloaded pre-built haex-vault binary from run $rid ($branch)"
                return 0
              fi
            done
            return 1
          }

          mkdir -p ./docker/prebuilt/haex-vault
          cd ./docker/prebuilt/haex-vault

          if download_artifact "$TARGET_BRANCH"; then
            ls -la
            chmod +x haex-vault 2>/dev/null || true
          elif [ "$TARGET_BRANCH" != "main" ] && download_artifact "main"; then
            echo "Used fallback artifact from main"
            ls -la
            chmod +x haex-vault 2>/dev/null || true
          else
            echo "Could not download artifact, will build from source"
            cd /
            rm -rf $GITHUB_WORKSPACE/docker/prebuilt/haex-vault
          fi

      - name: Prepare pre-built artifacts
        id: prebuilt
        run: |
          USE_PREBUILT_VAULT="false"
          USE_PREBUILT_SYNC_SERVER="false"

          # Check if haex-vault binary was downloaded (check for actual file, not just directory)
          if [ -f "./docker/prebuilt/haex-vault/haex-vault" ]; then
            echo "Found pre-built haex-vault binary"
            ls -la ./docker/prebuilt/haex-vault/
            USE_PREBUILT_VAULT="true"
            chmod +x ./docker/prebuilt/haex-vault/haex-vault
          else
            echo "No pre-built haex-vault binary found, will build from source"
            # Clean up empty directory if it exists
            rm -rf ./docker/prebuilt/haex-vault 2>/dev/null || true
          fi

          # Check if sync-server image is specified
          if [ -n "${{ inputs.sync_server_image }}" ]; then
            echo "Using pre-built sync-server image: ${{ inputs.sync_server_image }}"
            USE_PREBUILT_SYNC_SERVER="true"
          fi

          echo "use_prebuilt_vault=$USE_PREBUILT_VAULT" >> $GITHUB_OUTPUT
          echo "use_prebuilt_sync_server=$USE_PREBUILT_SYNC_SERVER" >> $GITHUB_OUTPUT

      - name: Log test configuration
        run: |
          echo "## E2E Test Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY

          # Show haex-vault source
          if [ "${{ steps.prebuilt.outputs.use_prebuilt_vault }}" == "true" ]; then
            echo "| haex-vault | \`PRE-BUILT ARTIFACT\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| haex-vault | \`${{ steps.versions.outputs.haex_vault_version }}\` |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| haextension | \`${{ steps.versions.outputs.haextension_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| vault-sdk | \`${{ steps.versions.outputs.vault_sdk_version }}\` |" >> $GITHUB_STEP_SUMMARY

          # Show sync-server source
          if [ "${{ steps.prebuilt.outputs.use_prebuilt_sync_server }}" == "true" ]; then
            echo "| sync-server | \`${{ inputs.sync_server_image }}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| sync-server | \`${{ steps.versions.outputs.sync_server_version }}\` |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and export Docker images
        env:
          HAEX_VAULT_VERSION: ${{ steps.versions.outputs.haex_vault_version }}
          HAEXTENSION_VERSION: ${{ steps.versions.outputs.haextension_version }}
          VAULT_SDK_VERSION: ${{ steps.versions.outputs.vault_sdk_version }}
          HAEX_SYNC_SERVER_VERSION: ${{ steps.versions.outputs.sync_server_version }}
          USE_PREBUILT_VAULT: ${{ steps.prebuilt.outputs.use_prebuilt_vault }}
          USE_PREBUILT_SYNC_SERVER: ${{ steps.prebuilt.outputs.use_prebuilt_sync_server }}
          SYNC_SERVER_IMAGE: ${{ inputs.sync_server_image }}
          # Paths to cloned repositories (must be absolute for docker-compose context resolution)
          HAEX_SYNC_SERVER_PATH: ${{ github.workspace }}/repos/haex-sync-server
          HAEX_MARKETPLACE_PATH: ${{ github.workspace }}/repos/haex-marketplace
        run: |
          echo "Building with:"
          if [ "$USE_PREBUILT_VAULT" == "true" ]; then
            echo "  haex-vault: PRE-BUILT"
          else
            echo "  haex-vault: $HAEX_VAULT_VERSION"
          fi
          echo "  haextension: $HAEXTENSION_VERSION"
          echo "  vault-sdk: $VAULT_SDK_VERSION"
          if [ "$USE_PREBUILT_SYNC_SERVER" == "true" ]; then
            echo "  sync-server: $SYNC_SERVER_IMAGE"
          else
            echo "  sync-server: $HAEX_SYNC_SERVER_VERSION (from $HAEX_SYNC_SERVER_PATH)"
          fi
          echo "  marketplace: from $HAEX_MARKETPLACE_PATH"

          # Build vault-a, sync-server, and marketplace (vault-b uses same image as vault-a)
          # CI override adds GHA layer cache so apt-get/cargo/playwright layers are reused
          echo "Building Docker images..."
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.ci.yml build vault-a sync-server marketplace

          # Export vault, sync-server, and marketplace images for parallel test jobs
          # docker-compose uses project name from directory (docker/)
          echo "Exporting Docker images..."
          echo "Available images:"
          docker images | grep -E "(vault|sync|marketplace)" || true

          # Get actual image names (format: <project>-<service>)
          # vault-a and vault-b use identical Dockerfile/args, so we only save vault-a
          VAULT_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "vault-a" | head -1)
          SYNC_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "sync-server" | head -1)
          MARKETPLACE_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "marketplace" | head -1)

          if [ -z "$VAULT_IMAGE" ] || [ -z "$SYNC_IMAGE" ]; then
            echo "ERROR: Could not find required images"
            docker images
            exit 1
          fi

          echo "Saving images: $VAULT_IMAGE, $SYNC_IMAGE, $MARKETPLACE_IMAGE (vault-b will be tagged from vault-a)"
          if [ -n "$MARKETPLACE_IMAGE" ]; then
            docker save $VAULT_IMAGE $SYNC_IMAGE $MARKETPLACE_IMAGE | gzip > docker-images.tar.gz
          else
            # Marketplace build may have failed or is not available
            echo "Warning: Marketplace image not found, saving without it"
            docker save $VAULT_IMAGE $SYNC_IMAGE | gzip > docker-images.tar.gz
          fi
          ls -lh docker-images.tar.gz

      - name: Upload Docker images artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-docker-image-${{ github.run_id }}
          path: docker-images.tar.gz
          retention-days: 1
          compression-level: 0  # Already gzipped

      # The Linux e2e job gets these for free — they're baked into the
      # vault-a image it runs directly. The native Windows/macOS runners
      # never build or load that image (their vault binary is a plain
      # download), so marketplace-setup.ts's haex-notes bundle + signing key
      # need to be extracted here and shipped separately.
      - name: Extract marketplace bundle for native runners
        run: |
          VAULT_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "vault-a" | head -1)
          cid=$(docker create "$VAULT_IMAGE")
          mkdir -p marketplace-bundle
          docker cp "$cid:/app/haex-notes.haex" marketplace-bundle/haex-notes.haex
          docker cp "$cid:/app/haex-notes-public.key" marketplace-bundle/haex-notes-public.key
          docker rm "$cid" > /dev/null
          ls -lh marketplace-bundle/

      - name: Upload marketplace bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: e2e-marketplace-bundle-${{ github.run_id }}
          path: marketplace-bundle/
          retention-days: 1

  # Parallel test execution using matrix strategy
  e2e:
    name: E2E Tests - ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-env
    # inputs.haex_vault_platform is only populated for workflow_call/
    # workflow_dispatch; direct push/PR triggers on this repo leave it empty,
    # which must still run the (default) Linux suite unchanged.
    if: inputs.haex_vault_platform == '' || inputs.haex_vault_platform == 'linux'

    strategy:
      fail-fast: false
      matrix:
        shard:
          - "workflows"    # vault-lifecycle, sync, spaces, storage, identity-auth, extensions
          - "other"        # database, ui, browser-extension, external-bridge
          # haex-pass shard removed: passwords are now first-class in haex-vault
          # via the `passwords::commands::extension_password_*` Tauri handlers,
          # so the dedicated haex-pass extension is no longer the source of
          # truth for that flow. `tests/external-bridge/` now covers the core
          # external-bridge API directly (get-items/get-totp/passkeys, tag-scope
          # enforcement, multi-target grants) and gates haex-vault CI via the
          # "other" shard — see haex-vault PR #674.

    outputs:
      success: ${{ steps.test.outcome == 'success' }}
      test_result: ${{ steps.test.outcome }}
      artifact_name: e2e-artifacts-${{ inputs.build_type || 'build' }}-${{ github.run_id }}-${{ matrix.shard }}
      run_id: ${{ github.run_id }}

    steps:
      - name: Checkout E2E tests
        uses: actions/checkout@v4
        with:
          repository: haex-space/haex-e2e-tests
          # Ref resolution priority:
          # 1. e2e_tests_ref input — explicit override, e.g. from haex-vault CI
          #    passing a feature branch to test against unreleased test changes.
          # 2. PR head SHA — on pull_request events directly against this repo.
          #    The github.repository guard is essential: under workflow_call
          #    the github context is the caller's, so head.sha would point at
          #    the caller's commit and not exist in this repo.
          #    head.sha (not head.ref) prevents shell injection via branch names.
          # 3. main — fallback for push and workflow_call without an override.
          ref: ${{ inputs.e2e_tests_ref || ((github.event_name == 'pull_request' && github.repository == 'haex-space/haex-e2e-tests') && github.event.pull_request.head.sha || 'main') }}

      - name: Clone dependency repositories
        run: |
          mkdir -p repos

          # Clone haex-sync-server (needed for kong.yml config)
          echo "Cloning haex-sync-server..."
          git clone --depth 1 https://github.com/haex-space/haex-sync-server.git repos/haex-sync-server

          # Clone haex-marketplace
          echo "Cloning haex-marketplace..."
          git clone --depth 1 https://github.com/haex-space/haex-marketplace.git repos/haex-marketplace

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android
          sudo apt-get clean

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: e2e-docker-image-${{ github.run_id }}

      - name: Load Docker images
        run: |
          echo "Loading Docker images..."
          gunzip -c docker-images.tar.gz | docker load

          # Tag vault-a as vault-b (they use identical Dockerfile)
          VAULT_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "vault-a" | head -1)
          docker tag "$VAULT_IMAGE" docker-vault-b:latest

          docker images

      - name: Pull base images
        run: |
          # Pull images that weren't exported (base images from registry)
          docker pull supabase/postgres:15.8.1.085
          docker pull supabase/gotrue:v2.169.0
          docker pull kong:2.8.1
          docker pull postgrest/postgrest:v12.2.0
          docker pull supabase/storage-api:v1.14.3

      - name: Start services
        env:
          USE_PREBUILT_VAULT: ${{ needs.build-env.outputs.use_prebuilt_vault }}
          SYNC_SERVER_IMAGE: ${{ inputs.sync_server_image }}
          # Paths to cloned repositories (must be absolute for docker-compose context resolution)
          HAEX_SYNC_SERVER_PATH: ${{ github.workspace }}/repos/haex-sync-server
          HAEX_MARKETPLACE_PATH: ${{ github.workspace }}/repos/haex-marketplace
        run: |
          # Start sync stack - database first, then dependent services
          echo "Starting sync-db..."
          docker compose -f docker/docker-compose.yml up -d sync-db
          echo "Waiting for sync-db to be healthy..."
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' haex_e2e_sync_db 2>/dev/null | grep -q healthy; then
              echo "sync-db healthy after ~$((i*2))s"
              break
            fi
            sleep 2
          done

          echo "Starting sync-gotrue, sync-realtime, sync-kong, sync-server..."
          docker compose -f docker/docker-compose.yml up -d sync-gotrue sync-realtime sync-kong sync-server

          # Start marketplace stack - database first, then dependent services
          echo "Starting marketplace-db..."
          docker compose -f docker/docker-compose.yml up -d marketplace-db
          echo "Waiting for marketplace-db to be healthy..."
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' haex_e2e_marketplace_db 2>/dev/null | grep -q healthy; then
              echo "marketplace-db healthy after ~$((i*2))s"
              break
            fi
            sleep 2
          done

          echo "Starting marketplace dependent services..."
          docker compose -f docker/docker-compose.yml up -d marketplace-gotrue marketplace-rest marketplace-storage marketplace-kong marketplace

          # Wait for all services to be healthy
          echo "Waiting for all services to be ready..."
          for i in {1..60}; do
            SYNC_STATUS=$(docker inspect --format='{{.State.Health.Status}}' haex_e2e_sync_server 2>/dev/null || echo "starting")
            REALTIME_STATUS=$(docker inspect --format='{{.State.Health.Status}}' realtime.haex_e2e_sync 2>/dev/null || echo "starting")
            MARKETPLACE_STATUS=$(docker inspect --format='{{.State.Health.Status}}' haex_e2e_marketplace 2>/dev/null || echo "starting")
            if [ "$SYNC_STATUS" == "healthy" ] && [ "$REALTIME_STATUS" == "healthy" ] && [ "$MARKETPLACE_STATUS" == "healthy" ]; then
              echo "All services ready after ~$((i*5))s"
              break
            fi
            echo "Waiting for services... ($i/60) - sync-server: $SYNC_STATUS, realtime: $REALTIME_STATUS, marketplace: $MARKETPLACE_STATUS"
            sleep 5
          done

          docker compose -f docker/docker-compose.yml ps

          # Dump container logs if any service is unhealthy
          if [ "$SYNC_STATUS" != "healthy" ] || [ "$REALTIME_STATUS" != "healthy" ] || [ "$MARKETPLACE_STATUS" != "healthy" ]; then
            echo "::error::Services failed to become healthy! Dumping logs..."
            if [ "$SYNC_STATUS" != "healthy" ] || [ "$REALTIME_STATUS" != "healthy" ]; then
              echo "=== sync-server logs ==="
              docker logs haex_e2e_sync_server 2>&1 || true
              echo "=== sync-db logs ==="
              docker logs haex_e2e_sync_db 2>&1 | tail -30 || true
              echo "=== sync-kong logs ==="
              docker logs haex_e2e_sync_kong 2>&1 | tail -20 || true
              echo "=== sync-realtime logs ==="
              docker logs realtime.haex_e2e_sync 2>&1 | tail -30 || true
            fi
            if [ "$MARKETPLACE_STATUS" != "healthy" ]; then
              echo "=== marketplace logs ==="
              docker logs haex_e2e_marketplace 2>&1 || true
            fi
            exit 1
          fi

      - name: Run E2E tests (${{ matrix.shard }})
        id: test
        env:
          USE_PREBUILT_VAULT: ${{ needs.build-env.outputs.use_prebuilt_vault }}
          CI: true
          # Paths to cloned repositories (must be absolute for docker-compose context resolution)
          HAEX_SYNC_SERVER_PATH: ${{ github.workspace }}/repos/haex-sync-server
          HAEX_MARKETPLACE_PATH: ${{ github.workspace }}/repos/haex-marketplace
        run: |
          # Start vault containers
          docker compose -f docker/docker-compose.yml up -d vault-a vault-b

          # Wait for tauri-driver to be ready
          echo "Waiting for tauri-driver to be ready..."
          for i in {1..30}; do
            if docker compose -f docker/docker-compose.yml exec -T vault-a curl -s http://localhost:4444/status > /dev/null 2>&1; then
              echo "tauri-driver ready after ~$((i*2))s"
              break
            fi
            echo "Waiting for tauri-driver... ($i/30)"
            sleep 2
          done

          # Determine test directory based on shard
          case "${{ matrix.shard }}" in
            "workflows")
              TEST_DIR="tests/vault-lifecycle tests/spaces tests/storage tests/sync tests/identity-auth tests/extensions"
              ;;
            "other")
              TEST_DIR="tests/database tests/ui tests/browser-extension tests/external-bridge"
              ;;
          esac

          echo "Running tests in: $TEST_DIR"
          docker compose -f docker/docker-compose.yml exec vault-a pnpm test $TEST_DIR

      - name: Copy test results from container
        if: always()
        run: |
          mkdir -p ./test-results
          docker run --rm \
            -v docker_test-results:/results \
            -v $(pwd)/test-results:/output \
            alpine sh -c "cp -r /results/* /output/ 2>&1 || echo 'Copy completed (may be empty)'"

      - name: Copy screenshots from container
        if: always()
        run: |
          mkdir -p ./test-results/screenshots
          # Copy screenshots from vault-a container
          docker cp haex_e2e_vault_a:/tmp/. ./test-results/screenshots/ 2>/dev/null || true
          # Filter only screenshot files
          find ./test-results/screenshots -type f ! -name "e2e-screenshot-*.png" -delete 2>/dev/null || true
          echo "Screenshots collected:"
          ls -la ./test-results/screenshots/ 2>/dev/null || echo "No screenshots found"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ inputs.build_type || 'build' }}-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            test-results/artifacts/
            test-results/html-report/
            test-results/results.json
            test-results/screenshots/
            test-results/haex-logs-freeze-repro/
          retention-days: 90

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml down -v

  # ===========================================================================
  # WINDOWS / macOS E2E — native runner + Tailscale-bridged backend
  #
  # GitHub's windows-latest/macos-latest runners can't run the Linux backend
  # containers directly (no Linux-container support on windows-latest, no
  # Docker at all on macos-latest), so each platform gets a paired job: a
  # Linux job builds the same backend stack as the `e2e` job above (minus
  # vault-a/vault-b, which run natively on the other runner instead), joins
  # an ephemeral Tailscale mesh, and stays up until its native-runner partner
  # finishes (there's no built-in "block until sibling job done" primitive in
  # Actions, so it polls this run's own job list via `gh api`). The native
  # job joins the same mesh and reaches the backend via Tailscale MagicDNS
  # instead of `localhost`/Docker service names.
  # ===========================================================================

  e2e-backend-windows:
    name: E2E Backend (for Windows)
    runs-on: ubuntu-latest
    needs: build-env
    if: inputs.haex_vault_platform == 'windows'
    timeout-minutes: 50
    steps:
      - name: Checkout E2E tests
        uses: actions/checkout@v4
        with:
          repository: haex-space/haex-e2e-tests
          ref: ${{ inputs.e2e_tests_ref || ((github.event_name == 'pull_request' && github.repository == 'haex-space/haex-e2e-tests') && github.event.pull_request.head.sha || 'main') }}

      - name: Clone dependency repositories
        run: |
          mkdir -p repos
          git clone --depth 1 https://github.com/haex-space/haex-sync-server.git repos/haex-sync-server
          git clone --depth 1 https://github.com/haex-space/haex-marketplace.git repos/haex-marketplace

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: e2e-docker-image-${{ github.run_id }}

      - name: Load Docker images
        run: |
          echo "Loading Docker images..."
          gunzip -c docker-images.tar.gz | docker load
          docker images

      - name: Pull base images
        run: |
          docker pull supabase/postgres:15.8.1.085
          docker pull supabase/gotrue:v2.169.0
          docker pull kong:2.8.1
          docker pull postgrest/postgrest:v12.2.0
          docker pull supabase/storage-api:v1.14.3

      # Identical to the `e2e` job's "Start services" step — see that step's
      # inline comments. Deliberately not deduplicated into a composite
      # action here to keep this change a plain diff against the existing,
      # battle-tested Linux path.
      - name: Start backend services
        env:
          USE_PREBUILT_VAULT: ${{ needs.build-env.outputs.use_prebuilt_vault }}
          SYNC_SERVER_IMAGE: ${{ inputs.sync_server_image }}
          HAEX_SYNC_SERVER_PATH: ${{ github.workspace }}/repos/haex-sync-server
          HAEX_MARKETPLACE_PATH: ${{ github.workspace }}/repos/haex-marketplace
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml up -d sync-db
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' haex_e2e_sync_db 2>/dev/null | grep -q healthy; then
              break
            fi
            sleep 2
          done
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml up -d sync-gotrue sync-realtime sync-kong sync-server
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml up -d marketplace-db
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' haex_e2e_marketplace_db 2>/dev/null | grep -q healthy; then
              break
            fi
            sleep 2
          done
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml up -d marketplace-gotrue marketplace-rest marketplace-storage marketplace-kong marketplace
          for i in {1..60}; do
            SYNC_STATUS=$(docker inspect --format='{{.State.Health.Status}}' haex_e2e_sync_server 2>/dev/null || echo "starting")
            REALTIME_STATUS=$(docker inspect --format='{{.State.Health.Status}}' realtime.haex_e2e_sync 2>/dev/null || echo "starting")
            MARKETPLACE_STATUS=$(docker inspect --format='{{.State.Health.Status}}' haex_e2e_marketplace 2>/dev/null || echo "starting")
            if [ "$SYNC_STATUS" == "healthy" ] && [ "$REALTIME_STATUS" == "healthy" ] && [ "$MARKETPLACE_STATUS" == "healthy" ]; then
              echo "All services ready after ~$((i*5))s"
              break
            fi
            sleep 5
          done
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml ps

      # tailnet name is deterministic (run-id based) so the Windows job can
      # compute the same MagicDNS hostname without querying anything.
      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci-e2e
          hostname: e2e-backend-win-${{ github.run_id }}

      - name: Wait for Windows E2E job to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Backend ready, waiting for 'E2E Windows' job to finish..."
          for _ in $(seq 1 280); do
            # Exact names only: an `endswith` match here also catches the
            # linux/macos legs' OWN "E2E Windows" placeholder job (skipped
            # immediately by its `if:`), which made this resolve after 1s
            # against the wrong leg and tear the backend down mid-test.
            CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
              --jq '.jobs[] | select(.name == "E2E Windows" or .name == "e2e-tests (windows, haex-vault-windows-e2e) / E2E Windows") | .conclusion' 2>/dev/null | head -1)
            if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "null" ]; then
              echo "E2E Windows finished with: $CONCLUSION"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Timed out waiting for E2E Windows job — tearing down anyway"

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml down -v

  e2e-windows:
    name: E2E Windows
    runs-on: windows-latest
    # Deliberately NOT depending on e2e-backend-windows: that job blocks on
    # this one's conclusion (see its "Wait for Windows E2E job to finish"
    # step), so needs-ing it back here would deadlock both jobs until the
    # backend's poll loop times out and tears the stack down unused.
    # Readiness is gated below instead ("Wait for backend to be ready").
    needs: build-env
    if: inputs.haex_vault_platform == 'windows'
    timeout-minutes: 45

    outputs:
      success: ${{ steps.test.outcome == 'success' }}
      test_result: ${{ steps.test.outcome }}

    steps:
      - name: Checkout E2E tests
        uses: actions/checkout@v4
        with:
          repository: haex-space/haex-e2e-tests
          ref: ${{ inputs.e2e_tests_ref || ((github.event_name == 'pull_request' && github.repository == 'haex-space/haex-e2e-tests') && github.event.pull_request.head.sha || 'main') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # package.json has no "packageManager" field (unlike haex-vault),
          # so pnpm/action-setup can't infer a version on its own — pin the
          # same major version haex-vault uses for consistency.
          version: 10
          run_install: false

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-driver
        run: cargo install tauri-driver

      # Microsoft Edge WebDriver must match the Edge build already on the
      # runner image (tauri-driver on Windows proxies WebView2 through it).
      - name: Install matching Microsoft Edge WebDriver
        shell: pwsh
        run: |
          $edgeVersion = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
          Write-Host "Detected Edge version: $edgeVersion"
          $driverUrl = "https://msedgedriver.microsoft.com/$edgeVersion/edgedriver_win64.zip"
          Invoke-WebRequest -Uri $driverUrl -OutFile edgedriver.zip
          Expand-Archive -Path edgedriver.zip -DestinationPath "$env:USERPROFILE\edgedriver"
          echo "$env:USERPROFILE\edgedriver" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Require a pre-built artifact run ID
        if: inputs.haex_vault_artifact_run_id == ''
        run: |
          Write-Host "::error::haex_vault_artifact_run_id is required when haex_vault_platform is 'windows' — there is no build-from-source fallback for native runners yet."
          exit 1

      - name: Download haex-vault Windows binary
        uses: actions/download-artifact@v4
        with:
          name: haex-vault-windows-e2e
          run-id: ${{ inputs.haex_vault_artifact_run_id }}
          repository: haex-space/haex-vault
          github-token: ${{ secrets.ARTIFACT_TOKEN || github.token }}
          path: ./vault-bin

      - name: Download marketplace bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-marketplace-bundle-${{ github.run_id }}
          path: ./marketplace-bundle

      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci-e2e

      # e2e-backend-windows is no longer a `needs` dependency (see the comment
      # on this job's `needs` above), so it may still be pulling/starting its
      # Docker services when we get here — poll until its port is reachable
      # over the Tailscale mesh instead of assuming it's already up.
      - name: Wait for backend to be ready
        env:
          BACKEND_HOST: e2e-backend-win-${{ github.run_id }}
        run: |
          Write-Host "Waiting for backend ($env:BACKEND_HOST:8000) to become reachable..."
          $ready = $false
          # 12 minutes: observed backend startup (docker image load + compose
          # health-wait + Tailscale join) takes up to ~8 minutes on a cold
          # cache, and the client and backend jobs start at the same time.
          for ($i = 0; $i -lt 90; $i++) {
              if (Test-NetConnection -ComputerName $env:BACKEND_HOST -Port 8000 -InformationLevel Quiet -WarningAction SilentlyContinue) {
                  $ready = $true
                  break
              }
              Start-Sleep -Seconds 8
          }
          if (!$ready) {
              throw "Backend at $env:BACKEND_HOST:8000 did not become reachable within 12 minutes"
          }
          Write-Host "Backend is reachable."

      - name: Start haex-vault + tauri-driver
        shell: pwsh
        env:
          # Same run-id-derived hostname the backend job registered under —
          # Tailscale MagicDNS resolves it without any extra discovery step.
          BACKEND_HOST: e2e-backend-win-${{ github.run_id }}
        run: ./scripts/start-vault-windows.ps1 -VaultBinDir "$PWD\vault-bin" -BackendHost $env:BACKEND_HOST

      - name: Run E2E tests (windows)
        id: test
        env:
          CI: true
          HAEX_NOTES_BUNDLE_PATH: ${{ github.workspace }}\marketplace-bundle\haex-notes.haex
          HAEX_NOTES_PUBLIC_KEY_PATH: ${{ github.workspace }}\marketplace-bundle\haex-notes-public.key
        # Not `pnpm test`: that script is `DISPLAY=:1 playwright test` for
        # the Linux container's xvfb, and `DISPLAY=:1 cmd` isn't valid
        # PowerShell/cmd syntax ("'DISPLAY' is not recognized...").
        # Windows/macOS have a real GUI, so DISPLAY is irrelevant here.
        run: pnpm exec playwright test tests/vault-lifecycle tests/spaces tests/storage tests/sync tests/identity-auth tests/extensions tests/database tests/ui tests/external-bridge

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ inputs.build_type || 'build' }}-${{ github.run_id }}-windows
          path: |
            test-results/artifacts/
            test-results/html-report/
            test-results/results.json
          retention-days: 90

      - name: Stop haex-vault + tauri-driver
        if: always()
        shell: pwsh
        run: ./scripts/stop-vault-windows.ps1

  e2e-backend-macos:
    name: E2E Backend (for macOS)
    runs-on: ubuntu-latest
    needs: build-env
    if: inputs.haex_vault_platform == 'macos'
    timeout-minutes: 50
    steps:
      - name: Checkout E2E tests
