          docker pull kong:2.8.1
          docker pull postgrest/postgrest:v12.2.0
          docker pull supabase/storage-api:v1.14.3

      # Identical to the `e2e` job's "Start services" step — see that step's
      # inline comments.
      - name: Start backend services
        env:
          USE_PREBUILT_VAULT: ${{ needs.build-env.outputs.use_prebuilt_vault }}
          SYNC_SERVER_IMAGE: ${{ inputs.sync_server_image }}
          HAEX_SYNC_SERVER_PATH: ${{ github.workspace }}/repos/haex-sync-server
          HAEX_MARKETPLACE_PATH: ${{ github.workspace }}/repos/haex-marketplace
        run: |
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml up -d sync-db
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' haex_e2e_sync_db 2>/dev/null | grep -q healthy; then
              break
            fi
            sleep 2
          done
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml up -d sync-gotrue sync-realtime sync-kong sync-server
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml up -d marketplace-db
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' haex_e2e_marketplace_db 2>/dev/null | grep -q healthy; then
              break
            fi
            sleep 2
          done
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml up -d marketplace-gotrue marketplace-rest marketplace-storage marketplace-kong marketplace
          for i in {1..60}; do
            SYNC_STATUS=$(docker inspect --format='{{.State.Health.Status}}' haex_e2e_sync_server 2>/dev/null || echo "starting")
            REALTIME_STATUS=$(docker inspect --format='{{.State.Health.Status}}' realtime.haex_e2e_sync 2>/dev/null || echo "starting")
            MARKETPLACE_STATUS=$(docker inspect --format='{{.State.Health.Status}}' haex_e2e_marketplace 2>/dev/null || echo "starting")
            if [ "$SYNC_STATUS" == "healthy" ] && [ "$REALTIME_STATUS" == "healthy" ] && [ "$MARKETPLACE_STATUS" == "healthy" ]; then
              echo "All services ready after ~$((i*5))s"
              break
            fi
            sleep 5
          done
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml ps

      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci-e2e
          hostname: e2e-backend-mac-${{ github.run_id }}

      - name: Wait for macOS E2E job to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Backend ready, waiting for 'E2E macOS' job to finish..."
          for _ in $(seq 1 280); do
            # Exact names only: an `endswith` match here also catches the
            # linux/windows legs' OWN "E2E macOS" placeholder job (skipped
            # immediately by its `if:`), which made this resolve after 1s
            # against the wrong leg and tear the backend down mid-test.
            CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate \
              --jq '.jobs[] | select(.name == "E2E macOS" or .name == "e2e-tests (macos, haex-vault-macos-e2e) / E2E macOS") | .conclusion' 2>/dev/null | head -1)
            if [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "null" ]; then
              echo "E2E macOS finished with: $CONCLUSION"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Timed out waiting for E2E macOS job — tearing down anyway"

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.tailscale.yml down -v

  e2e-macos:
    name: E2E macOS
    runs-on: macos-latest
    # Deliberately NOT depending on e2e-backend-macos — see the matching
    # comment on e2e-windows' `needs` for why (avoids a needs/wait-loop
    # deadlock). Readiness is gated below instead ("Wait for backend to be
    # ready").
    needs: build-env
    if: inputs.haex_vault_platform == 'macos'
    timeout-minutes: 45

    outputs:
      success: ${{ steps.test.outcome == 'success' }}
      test_result: ${{ steps.test.outcome }}

    steps:
      - name: Checkout E2E tests
        uses: actions/checkout@v4
        with:
          repository: haex-space/haex-e2e-tests
          ref: ${{ inputs.e2e_tests_ref || ((github.event_name == 'pull_request' && github.repository == 'haex-space/haex-e2e-tests') && github.event.pull_request.head.sha || 'main') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # package.json has no "packageManager" field (unlike haex-vault),
          # so pnpm/action-setup can't infer a version on its own — pin the
          # same major version haex-vault uses for consistency.
          version: 10
          run_install: false

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Package/binary name confirmed against crates.io metadata for
      # tauri-webdriver (published as `tauri-webdriver`, binary of the same
      # name) — still not yet run against a real macOS runner.
      - name: Install tauri-webdriver
        run: cargo install tauri-webdriver --locked

      - name: Require a pre-built artifact run ID
        if: inputs.haex_vault_artifact_run_id == ''
        run: |
          echo "::error::haex_vault_artifact_run_id is required when haex_vault_platform is 'macos' — there is no build-from-source fallback for native runners yet."
          exit 1

      - name: Download haex-vault macOS binary
        uses: actions/download-artifact@v4
        with:
          name: haex-vault-macos-e2e
          run-id: ${{ inputs.haex_vault_artifact_run_id }}
          repository: haex-space/haex-vault
          github-token: ${{ secrets.ARTIFACT_TOKEN || github.token }}
          path: ./vault-bin

      - name: Download marketplace bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-marketplace-bundle-${{ github.run_id }}
          path: ./marketplace-bundle

      - name: Join Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci-e2e

      # e2e-backend-macos is no longer a `needs` dependency (see the comment
      # on this job's `needs` above), so it may still be pulling/starting its
      # Docker services when we get here — poll until its port is reachable
      # over the Tailscale mesh instead of assuming it's already up.
      - name: Wait for backend to be ready
        env:
          BACKEND_HOST: e2e-backend-mac-${{ github.run_id }}
        run: |
          echo "Waiting for backend ($BACKEND_HOST:8000) to become reachable..."
          # Root cause (found via the route/curl diagnostics below on a prior
          # run): routing is fine (utun4 correctly owns 100.64.0.0/10) and
          # `tailscale ping` succeeds, but that's resolved through tailscaled's
          # own control socket, not the OS resolver — `curl`/`nc` against the
          # MagicDNS hostname fail with "Could not resolve host", and
          # dscacheutil has been empty in every diagnostic dump for the same
          # reason. MagicDNS split-DNS isn't usable by ordinary processes on
          # this runner. Resolve the peer's IP via `tailscale ip` (proven to
          # work — it's answered the same way `tailscale ping` is) and use
          # that IP for everything downstream instead of the hostname.
          #
          # 18 minutes, wall-clock (not iteration count): observed backend
          # startup (docker image load + compose health-wait + Tailscale
          # join) has ranged from ~8 to ~12 minutes across runs. A fixed
          # iteration count silently changes total budget with any tweak to
          # the per-attempt timeout or sleep — e.g. bumping nc's -w from 2
          # to 6 while cutting sleep 8->4 (for DERP-relayed connections
          # needing more than 2s to land) accidentally HALVED the total
          # budget to 6 minutes whenever nc fails fast, which is exactly
          # what happened on a run where the backend needed 11m50s to even
          # join Tailscale.
          DEADLINE=$((SECONDS + 18 * 60))
          BACKEND_IP=""
          while [ $SECONDS -lt $DEADLINE ]; do
            if [ -z "$BACKEND_IP" ]; then
              BACKEND_IP=$(tailscale ip -4 "$BACKEND_HOST" 2>/dev/null || true)
            fi
            if [ -n "$BACKEND_IP" ] && nc -z -w 6 "$BACKEND_IP" 8000 2>/dev/null; then
              echo "Backend is reachable at $BACKEND_IP."
              echo "BACKEND_IP=$BACKEND_IP" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backend at $BACKEND_HOST:8000 (resolved: ${BACKEND_IP:-<unresolved>}) did not become reachable within 18 minutes"
          echo "--- tailscale status ---"
          sudo tailscale status || true
          echo "--- tailscale ping ($BACKEND_HOST) ---"
          sudo tailscale ping -c 1 "$BACKEND_HOST" || true
          echo "--- DNS resolution ---"
          dscacheutil -q host -a name "$BACKEND_HOST" || true
          echo "--- utun interfaces ---"
          ifconfig | grep -A3 utun || true
          echo "--- tailscale netcheck ---"
          sudo tailscale netcheck || true
          echo "--- route to $BACKEND_HOST ($BACKEND_IP) ---"
          [ -n "$BACKEND_IP" ] && route -n get "$BACKEND_IP" || true
          echo "--- curl -v attempt (by IP) ---"
          [ -n "$BACKEND_IP" ] && curl -v --connect-timeout 6 "http://$BACKEND_IP:8000/" 2>&1 || true
          exit 1

      - name: Start haex-vault + tauri-webdriver
        env:
          # MagicDNS hostname resolution doesn't work for ordinary processes
          # on this runner (see the note above) — BACKEND_IP was resolved via
          # `tailscale ip` and exported by the previous step; falling back to
          # the hostname would only matter if that step exited 0 without ever
          # setting it, which doesn't happen.
          BACKEND_HOST: ${{ env.BACKEND_IP }}
        run: ./scripts/start-vault-macos.sh "$PWD/vault-bin" "$BACKEND_HOST"

      - name: Run E2E tests (macos)
        id: test
        env:
          CI: true
          HAEX_NOTES_BUNDLE_PATH: ${{ github.workspace }}/marketplace-bundle/haex-notes.haex
          HAEX_NOTES_PUBLIC_KEY_PATH: ${{ github.workspace }}/marketplace-bundle/haex-notes-public.key
        # Not `pnpm test`: see the matching note in the Windows job — same
        # DISPLAY=:1 prefix, irrelevant (and unnecessary) outside the Linux
        # container's xvfb setup.
        run: pnpm exec playwright test tests/vault-lifecycle tests/spaces tests/storage tests/sync tests/identity-auth tests/extensions tests/database tests/ui tests/external-bridge

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ inputs.build_type || 'build' }}-${{ github.run_id }}-macos
          path: |
            test-results/artifacts/
            test-results/html-report/
            test-results/results.json
          retention-days: 90

      - name: Stop haex-vault + tauri-webdriver
        if: always()
        run: ./scripts/stop-vault-macos.sh

  # Aggregate results from parallel test jobs. Legs not requested for this
  # platform run show up as 'skipped' (not 'success'/'failure') and must not
  # fail the gate — only an actually-run leg failing should.
  e2e-results:
    name: E2E Test Results
    runs-on: ubuntu-latest
    needs: [e2e, e2e-backend-windows, e2e-windows, e2e-backend-macos, e2e-macos]
    if: always()

    outputs:
      success: ${{ steps.check.outputs.success }}
      test_result: ${{ steps.check.outputs.result }}
      artifact_name: e2e-artifacts-${{ inputs.build_type || 'build' }}-${{ github.run_id }}
      run_id: ${{ github.run_id }}

    steps:
      - name: Check test results
        id: check
        run: |
          # Only one platform's leg (backend + native) actually runs per
          # haex_vault_platform value — the rest report 'skipped', which
          # must count as OK, not as a failure. Backend jobs are included so
          # a backend failure is never masked: after the deadlock fix, the
          # native job no longer needs-depends on its backend (see e2e-windows/
          # e2e-macos comments), so it runs standalone and fails on its own
          # readiness-poll timeout if the backend never came up — but listing
          # the backend result here too keeps the gate correct even if that
          # readiness poll ever races past a since-crashed backend.
          FAILED=false
          for result in "${{ needs.e2e.result }}" \
                        "${{ needs.e2e-backend-windows.result }}" "${{ needs.e2e-windows.result }}" \
                        "${{ needs.e2e-backend-macos.result }}" "${{ needs.e2e-macos.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              FAILED=true
            fi
          done

          if [ "$FAILED" == "false" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✅ All E2E tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "❌ Some E2E tests failed" >> $GITHUB_STEP_SUMMARY
          fi

