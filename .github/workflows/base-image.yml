name: Build E2E Base Image

on:
  # Rebuild weekly (tooling updates) or on-demand
  schedule:
    - cron: '0 4 * * 1'  # Monday 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.base'

jobs:
  build-base:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.base
          push: true
          tags: |
            ghcr.io/haex-space/haex-e2e-base:latest
            ghcr.io/haex-space/haex-e2e-base:${{ github.sha }}
          cache-from: type=gha,scope=e2e-base
          cache-to: type=gha,scope=e2e-base,mode=max
